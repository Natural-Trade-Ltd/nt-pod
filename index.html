<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Entrega · Global Forest</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a24;--muted:#6b726c;--line:#e2ddd2;--ok:#2f6b3f;--warn:#b07a12;--crit:#a3342c;--azul:#3d6b8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#24362b;color:#fff;padding:14px 16px}
header b{font-size:18px}
header div{opacity:.8;font-size:13px}
main{padding:14px 16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.v{margin-bottom:8px}
.big{display:block;width:100%;border:0;border-radius:12px;padding:18px;margin:10px 0;font-size:18px;font-weight:600;color:#fff;cursor:pointer}
.big[disabled]{opacity:.6}
.b0{background:#6b4f2a}.b1{background:var(--azul)}.b2{background:var(--ok)}.b3{background:var(--crit)}
label{display:block;margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs div{position:relative;width:31%}.thumbs img{width:100%;border-radius:6px;display:block}
.thumbs button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.fbtn{display:inline-block;margin:6px 6px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600;cursor:pointer}
.fbtn input{display:none}
.msg{padding:12px;border-radius:8px;margin:10px 0}
.okm{background:#e3f0e6;color:var(--ok)}.errm{background:#f6e3e1;color:var(--crit)}.infom{background:#eef2f6;color:var(--azul)}
.muted{color:var(--muted);font-size:13px}
.volver{background:none;border:0;color:var(--azul);font-size:15px;padding:8px 0;cursor:pointer}
</style>
</head>
<body>
<header><b>Global Forest · Entrega</b><div id="hfolio">&nbsp;</div></header>
<main id="app"><div class="msg infom">Cargando…</div></main>
<script>
// Portal del transportista (POD por QR de la Carta Porte). Datos en Supabase (pod-api); NetSuite los sincroniza.
const API='https://cytopyytymxjwvfhosvg.supabase.co/functions/v1/pod-api';
const T=new URLSearchParams(location.search).get('t')||'';
const TIPOS=['Material mojado','Lona rota','Ponchadura / falla mecánica','Accidente','Daño a mercancía','Faltante','Rechazo / no recibida','Retraso en entrega','Estadía','Otro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,P=null,CUR=null,GPS={};
// 9-oct (Jorge): furgón con un solo QR (carga definida por el patio). Cada camión es una «entrega parcial»: la 1 es el camión del QR;
// «Soy un camión nuevo» abre la siguiente. CUR = la entrega que este celular está siguiendo (se recuerda en el celular).
const MIA='pod_parcial_'+T;
const S=()=>{if(!D||!D.multi||!CUR||CUR===1)return D;const e=(P||[]).find(x=>x.n===CUR)||{};return Object.assign({},D,{status:e.status,llegada:e.llegada,pod:!!e.pod});};
const deN=n=>'Entrega '+n+' de '+(D.multi_total||'?');
async function cargar(){const r=await fetch(API+'?t='+encodeURIComponent(T));const j=await r.json();if(j.error)throw new Error(j.error);D=j.camion;P=j.parciales||null;
  if(D.multi&&CUR==null){try{const n=+localStorage.getItem(MIA);if(n&&(P||[]).some(x=>x.n===n))CUR=n;}catch(e){}}}
function furgon(msg){
  $('#hfolio').textContent=[D.folio,String(D.so||'').replace(/^(Orden de venta|Sales Order) #/,'')].filter(Boolean).join(' · ');
  const L=P||[];const abiertas=L.filter(e=>!e.pod&&RK.indexOf(e.status||'')>=3);
  $('#app').innerHTML=(msg?'<div class="msg okm">'+esc(msg)+'</div>':'')
   +'<div class="card"><div class="k">Cliente</div><div class="v"><b>'+esc(D.cliente)+'</b></div>'
   +'<div class="msg infom"><b>🚛 Furgón repartido en varios camiones.</b> Cada camión registra su propia entrega: carga, llegada y POD. Anota en tu columna de la Carta Porte lo que llevas.</div>'
   +'<div class="k">Entregar en</div><div class="v">'+esc(D.destino||'—')+'</div><div class="k">Carga del furgón</div><div class="v">'+esc(D.carga||'—')+'</div></div>'
   +'<div class="card"><div class="k">Entregas</div>'+L.map(e=>'<div class="v" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><b>'+esc(deN(e.n))+'</b>'+(e.placas?' · '+esc(e.placas):'')+'<br><span class="muted">'+esc(e.n===1&&RK.indexOf(e.status||'')<3?'sin salir':e.status||'—')+(e.pod?' · ✔ POD':'')+'</span></span>'
     +((e.n===1&&RK.indexOf(e.status||'')<3)?'':'<button class="fbtn" data-n="'+e.n+'">'+(e.pod?'Ver':'Es la mía')+'</button>')+'</div>').join('')+'</div>'
   +(D.multi_total?'<div class="msg okm">✔ Furgón entregado completo en '+esc(D.multi_total)+' entregas.</div>':'<button class="big b0" id="nuevo">🚚 Soy un camión nuevo: ya cargué y salí</button>')
   +(abiertas.length&&!D.multi_total?'<p class="muted">Si ya registraste tu salida, toca «Es la mía» en tu entrega para seguir con la llegada y el POD.</p>':'');
  $('#app').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{CUR=+b.dataset.n;try{localStorage.setItem(MIA,CUR);}catch(e){}inicio();});
  if($('#nuevo'))$('#nuevo').onclick=()=>forma('salida',true);
}
function gps(){if(!navigator.geolocation){const g=$('#gps');if(g)g.textContent='⚠ Este celular no comparte ubicación';return;}
  navigator.geolocation.getCurrentPosition(p=>{GPS={lat:p.coords.latitude,lng:p.coords.longitude,prec:p.coords.accuracy};const g=$('#gps');if(g)g.textContent='📍 Ubicación lista (±'+Math.round(p.coords.accuracy)+' m)';},
    ()=>{const g=$('#gps');if(g)g.textContent='⚠ Sin ubicación: permite el GPS en tu navegador';},{enableHighAccuracy:true,timeout:15000});}
function reducir(f){return new Promise((ok,ko)=>{const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{const m=1600;let w=img.width,h=img.height;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    ok({tipo:'image/jpeg',base64:cv.toDataURL('image/jpeg',0.8).split(',')[1],url:cv.toDataURL('image/jpeg',0.4)});};img.onerror=ko;img.src=rd.result;};
  rd.onerror=ko;rd.readAsDataURL(f);});}
function inicio(msg){
  if(D.multi&&!CUR)return furgon(msg);
  const D0=D;D=S();   // en un furgón: estatus de la entrega que sigue este celular
  try{inicio0(msg);}finally{D=D0;}
  if(D.multi&&!D.cerrado){$('#app').insertAdjacentHTML('afterbegin','<div class="msg infom" style="display:flex;justify-content:space-between;align-items:center"><b>🚛 '+esc(deN(CUR))+'</b><button class="volver" id="todas">Ver todas las entregas</button></div>');
    $('#todas').onclick=()=>{CUR=null;try{localStorage.removeItem(MIA);}catch(e){}furgon();};}
}
function inicio0(msg){
  $('#hfolio').textContent=[D.folio,String(D.so||'').replace(/^(Orden de venta|Sales Order) #/,'')].filter(Boolean).join(' · ');
  // 6-oct: traslado (puerto → patio, patio ↔ bodega): otro color y otro lenguaje; nunca «entregué»
  document.querySelector('header').style.background=D.traslado?'#4F6D8A':'';
  document.querySelector('header b').textContent=D.traslado?'Global Forest · TRASLADO':'Global Forest · Entrega';
  $('#app').innerHTML=(msg?'<div class="msg okm">'+esc(msg)+'</div>':'')
   +'<div class="card"><div class="k">Cliente</div><div class="v"><b>'+esc(D.cliente)+'</b></div>'
   +(D.traslado?'<div class="msg infom" style="background:#e6edf4;color:#2f4a63"><b>⇄ Traslado a patio o bodega.</b> No es la entrega al cliente.</div>':'')
   +'<div class="k">'+(D.traslado?'Descargar en (patio o bodega)':'Entregar en')+'</div><div class="v">'+esc(D.destino||'—')+'</div>'
   +'<div class="k">Carga</div><div class="v">'+esc(D.carga||'—')+'</div>'
   +'<div class="k">Transportista · unidad</div><div class="v">'+esc(D.transportista||'—')+' · '+esc(D.unidad||'')+'</div>'
   +'<div class="k">Estatus</div><div>'+esc(D.status||'—')+(D.pod?' · ✔ POD recibido':'')+'</div></div>'
   +(D.cerrado?'<div class="msg errm" style="font-size:17px"><b>⚠ Este link ya está cerrado.</b><br>Es de un viaje que ya se entregó. Si vas en un viaje nuevo, abre el link nuevo que te mandó logística o escanea el QR de la Carta Porte nueva.</div>':pasos());
  if(!D.cerrado&&(D.pod||RK.indexOf(D.status||'')>=5))$('#app').insertAdjacentHTML('afterbegin','<div class="msg errm" style="font-size:17px"><b>⚠ Este viaje ya se '+(D.traslado?'descargó':'entregó')+'.</b><br>Si vas en un viaje nuevo, este link <b>no es el tuyo</b>: abre el link nuevo que te mandó logística o escanea el QR de la Carta Porte nueva.</div>');
  if(!D.cerrado){[['a0','salida'],['a1','llegada'],['a2','entrega'],['a4','pod_extra'],['a3','incidente']].forEach(([id,acc])=>{if($('#'+id))$('#'+id).onclick=()=>forma(acc);});}
}
// Cada botón desaparece cuando su paso ya quedó registrado (Jorge 27-sep); en su lugar sale una palomita
const RK=['Borrador','Asignada','Confirmada','En tránsito','En destino','Entregada','POD recibido','Facturada','Cerrada'];
function pasos(){const rk=RK.indexOf(D.status||'');const ok=t=>'<div class="msg okm">✔ '+t+'</div>';
  const salio=rk>=3,llego=rk>=4||!!D.llegada,entrego=!!D.pod||rk>=5;
  const T=!!D.traslado;
  return (salio?ok('Salida registrada'):'<button class="big b0" id="a0">🚚 Ya cargué y salí</button>')
   +(llego?ok(T?'Llegada al patio registrada':'Llegada registrada'):'<button class="big b1" id="a1">'+(T?'📍 Llegué al patio / bodega':'📍 Llegué a la planta del cliente')+'</button>')
   +(entrego?ok(T?'Descarga registrada. ¡Gracias!':'Entrega registrada con POD. ¡Gracias!')+'<button class="big b2" id="a4" style="background:#fff;color:var(--ok);border:2px solid var(--ok)">📎 Agregar fotos a la entrega<br><span style="font-size:13px;font-weight:400">faltó una firma, una hoja o salió borrosa</span></button>':(T?'<button class="big b2" id="a2" style="background:#4F6D8A">📦 Descargué (foto del comprobante del patio)</button>':'<button class="big b2" id="a2">✔ Entregué (foto de la Carta Porte firmada)</button>'))
   +(entrego?'':'<button class="big b3" id="a3">⚠ Reportar un incidente</button>');
}
function forma(acc,nuevo){gps();
  const tit=(D.traslado?{pod_extra:'Fotos adicionales de la descarga',salida:'Salida con la carga',llegada:'Llegada al patio / bodega',entrega:'Descarga en patio / bodega',incidente:'Reportar incidente'}
    :{pod_extra:'Fotos adicionales de la entrega',salida:'Salida con la carga',llegada:'Llegada a planta',entrega:'Entrega total',incidente:'Reportar incidente'})[acc];
  const foto={pod_extra:'Fotos que faltaron (firma, sello, hoja adicional)',salida:'Fotos de la unidad cargada (con lona / amarres)',llegada:D.traslado?'Fotos de la unidad en el patio o bodega':'Fotos de la unidad en la planta del cliente',entrega:D.traslado?'Fotos del comprobante de descarga del patio o bodega (o la Carta Porte sellada)':'Fotos de la Carta Porte con firma y sello del cliente y, si el patio te lo dio, del reporte de salida del patio',incidente:'Fotos del incidente'}[acc];
  $('#app').innerHTML='<button class="volver" id="bk">← Volver</button><div class="card"><h2 style="margin:0 0 6px">'+(nuevo?'Camión nuevo · salida con la carga':tit)+'</h2><div class="muted" id="gps">📍 Obteniendo ubicación…</div>'
   +(nuevo?'<label>Placas del tracto</label><input id="pl" autocomplete="off"><label>¿Qué cargaste? (lo que anotaste en tu columna de la Carta Porte)</label><textarea id="cg" rows="3" placeholder="Ej. 12 paquetes de 2x4x8, 6 de 2x6x10"></textarea><div class="muted">Toma también foto de tu columna anotada en la Carta Porte.</div>':'')
   +(acc==='pod_extra'?'<label>¿Qué se agrega?</label><select id="tipo">'+['Faltaba una firma o sello','Hoja adicional de la Carta Porte','La foto anterior salió borrosa','Otro'].map(t=>'<option>'+esc(t)+'</option>').join('')+'</select>':'')
   +(acc==='incidente'?'<label>¿Qué pasó?</label><select id="tipo">'+TIPOS.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select>':'')
   +'<label>'+foto+' (hasta 10)</label><label class="fbtn">📷 Tomar foto<input type="file" id="fc" accept="image/*" capture="environment"></label><label class="fbtn">🖼 Galería<input type="file" id="fg" accept="image/*" multiple></label><div class="thumbs" id="th"></div>'
   +'<label>Tu nombre</label><input id="nom" autocomplete="name">'
   +'<label>'+(acc==='entrega'?'Quién recibió / comentarios':'Comentarios')+' (opcional)</label><textarea id="nt" rows="3"></textarea>'
   +'<div id="m"></div><button class="big '+(acc==='incidente'?'b3':(acc==='entrega'||acc==='pod_extra')?'b2':acc==='salida'?'b0':'b1')+'" id="go">Enviar</button></div>';
  let fotos=[];
  $('#bk').onclick=()=>inicio();
  const pintarFotos=()=>{$('#th').innerHTML=fotos.map((f,i)=>'<div><img src="'+f.url+'"><button data-i="'+i+'" aria-label="Quitar">×</button></div>').join('');
    $('#th').querySelectorAll('button').forEach(b=>b.onclick=()=>{fotos.splice(+b.dataset.i,1);pintarFotos();});};
  const agregar=async e=>{for(const f of [...e.target.files]){if(fotos.length>=10)break;try{fotos.push(await reducir(f));}catch(er){}}e.target.value='';pintarFotos();};
  $('#fc').onchange=agregar;$('#fg').onchange=agregar;
  $('#go').onclick=async()=>{const m=$('#m');
    if(acc!=='incidente'&&!fotos.length){m.innerHTML='<div class="msg errm">Toma la foto antes de enviar.</div>';return;}
    if(nuevo&&(!$('#pl').value.trim()||!$('#cg').value.trim())){m.innerHTML='<div class="msg errm">Escribe las placas y lo que cargaste.</div>';return;}
    $('#go').disabled=true;m.innerHTML='<div class="msg infom">Enviando…</div>';
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,accion:acc,fotos:fotos.map(f=>({tipo:f.tipo,base64:f.base64})),
        lat:GPS.lat,lng:GPS.lng,prec:GPS.prec,nombre:$('#nom').value,nota:$('#nt').value,tipo:(acc==='incidente'||acc==='pod_extra')?$('#tipo').value:'',hora_cel:new Date().toLocaleString('es-MX'),
        parcial:nuevo?'nuevo':(D.multi&&CUR?CUR:undefined),placas:nuevo?$('#pl').value.trim():undefined,carga_txt:nuevo?$('#cg').value.trim():undefined})});
      const j=await r.json();if(j.error)throw new Error(j.error);
      if(D.multi){if(j.parcial){CUR=j.parcial;try{localStorage.setItem(MIA,CUR);}catch(e){}}try{await cargar();}catch(e){}inicio(j.msg+(nuevo&&j.parcial?' Eres la '+deN(j.parcial)+'.':''));return;}
      if(acc==='salida')D.status='En tránsito';if(acc==='llegada'){D.status='En destino';D.llegada=new Date().toISOString();}if(acc==='entrega'){D.pod=true;D.status='POD recibido';}
      inicio(j.msg);}
    catch(er){$('#go').disabled=false;m.innerHTML='<div class="msg errm">'+esc(er.message||'No se pudo enviar. Revisa tu señal e intenta de nuevo.')+'</div>';}};
}
(async()=>{
  if(!T){$('#app').innerHTML='<div class="msg errm">Falta el código. Escanea el QR de la Carta Porte.</div>';return;}
  try{await cargar();inicio();}
  catch(e){$('#app').innerHTML='<div class="msg errm">'+esc(e.message||'No se pudo abrir la entrega.')+'</div><p class="muted">Escanea de nuevo el QR de la Carta Porte o llama a logística.</p>';}
})();
</script>
</body>
</html>
